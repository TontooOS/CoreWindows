[package]
name = "corewindows"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "CoreWindows for TontooOS - list currently open windows with toolkit type and app icons"
authors = ["arlomu"]
repository = "https://github.com/TontooOS/Libs"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]
name = "corewindows"
path = "src/lib.rs"

[[example]]
name = "list_windows"
path = "examples/list_windows.rs"

[[example]]
name = "list_programs"
path = "examples/list_programs.rs"

[dependencies]
foundation = { path = "../Foundation" }
archivekit = { path = "../ArchiveKit" }

[dev-dependencies]
tempfile = "3"
coreicon = { path = "../CoreIcon" }
